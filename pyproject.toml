[project]
name = "ai-stack-diagnostics"
version = "0.3.0"
description = "Read-only MCP server that diagnoses AI/ML project setups"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Prasanna Balaji L" }]
keywords = ["mcp", "model-context-protocol", "ai", "ml", "diagnostics", "llm", "rag", "gpu", "cuda"]
dependencies = ["mcp>=2.3,<3", "pydantic>=2", "packaging>=23", "tomli>=2; python_version < '3.11'"]

[project.urls]
Repository = "https://github.com/PrasannaBalaji29/ai-stack-diagnostics"
Issues = "https://github.com/PrasannaBalaji29/ai-stack-diagnostics/issues"

[project.optional-dependencies]
dashboard = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8", "httpx>=0.27", "hypothesis>=6", "ruff", "mypy", "bandit", "pip-audit", "fastapi>=0.115", "uvicorn>=0.30"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "S", "SIM"]
ignore = ["E501", "S101", "S603", "S607", "S110", "SIM105"]

[tool.ruff.lint.per-file-ignores]
# loopback-only http(s) requests; "0.0.0.0" is only compared, never bound; no SQL anywhere
"diagnostics/checks/ollama.py" = ["S104", "S310"]
"diagnostics/checks/env_keys.py" = ["S608"]
"tests/*" = ["S", "UP012", "E702"]

[tool.mypy]
ignore_missing_imports = true

[tool.bandit]
# B104: "0.0.0.0" is only compared (a Windows quirk in the Ollama URL), never bound
# B105: a header *name*, not a password
skips = ["B104", "B105"]
